name: Auto Update Proxies

on:
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Free_Proxy_List
        uses: actions/checkout@v3
        with:
          path: main-repo

      - name: Checkout free-proxy-checker
        uses: actions/checkout@v3
        with:
          repository: azestkingscrown/free-proxy-checker
          path: checker-repo

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.0'

      - name: Run proxy checker
        run: |
          cd checker-repo
          go run cmd/main.go -workers 50 -outdir ../main-repo
      
      - name: Commit and push changes
        run: |
          cd main-repo
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add working_proxies.txt proxy_stats.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update proxies [skip ci]"
            git push
          fi
